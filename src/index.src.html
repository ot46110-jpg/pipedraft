<title>PipeDraft 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen CAD viewport. Tool bar on top, 3D canvas fills the middle, status line below, BOM sheet slides over the canvas. Single dark drafting look by choice. */
:root {
  --bg: #0d1418;
  --panel: #141d23;
  --line: #25343d;
  --fg: #d5e1e6;
  --dim: #8399a3;
  --accent: #ffb21f;
  --accent-fg: #1a1200;
  --danger: #ff7a6b;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; }
.bar { background: var(--panel); border-color: var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#top { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 8px; overflow-x: auto; }
#top::-webkit-scrollbar { display: none; }
.brand { font-weight: 600; letter-spacing: .02em; white-space: nowrap; margin-right: 4px; }
.brand small { display: block; font: 400 10px/1.2 var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.group { display: flex; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
button, select { font: 500 13px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled), select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .35; cursor: default; }
select { background: var(--bg); }
#stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#elev { position: absolute; bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
#elev output { font: 500 12px var(--font-data); color: var(--accent); padding: 0 8px; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
#bom { position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100% - 32px)); max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
#bom h2 { margin: 0 0 8px; font: 600 11px var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
#bom table { width: 100%; border-collapse: collapse; font: 400 12.5px var(--font-data); font-variant-numeric: tabular-nums; }
#bom td { padding: 6px 0; border-bottom: 1px solid var(--line); }
#bom td:last-child { text-align: right; color: var(--accent); }
#bom .empty { color: var(--dim); font-size: 13px; }
#bom .actions { margin-top: 12px; display: flex; gap: 8px; }
#status { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-block: 8px; font: 400 12px var(--font-data); color: var(--dim); }
#status span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status #pos { color: var(--fg); flex: none; }
#toast { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 6px; padding: 8px 14px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
/* iPad: full-screen standalone, no rubber-band or callouts, roomy touch targets */
html { overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
#top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
#status { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
@media (pointer: coarse) { button, select { min-height: 48px; min-width: 48px; } }
</style>

<div id="app">
  <header id="top" class="bar">
    <div class="brand">PipeDraft 3D<small id="mode">Example layout</small></div>
    <div class="group" role="group" aria-label="Tools">
      <button id="t-nav" data-tool="nav" aria-pressed="false">Navigate</button>
      <button id="t-pipe" data-tool="pipe" aria-pressed="true">Pipe</button>
      <button id="t-valve" data-tool="valve" aria-pressed="false">Valve</button>
      <button id="t-del" data-tool="del" aria-pressed="false">Delete</button>
    </div>
    <div class="group">
      <label for="nps" class="sr" style="position:absolute;left:-9999px">Pipe size</label>
      <select id="nps" aria-label="Pipe size">
        <option value="2">NPS 2 · 60.3 mm</option>
        <option value="3">NPS 3 · 88.9 mm</option>
        <option value="4" selected>NPS 4 · 114.3 mm</option>
        <option value="6">NPS 6 · 168.3 mm</option>
      </select>
      <select id="sched" aria-label="Schedule"><option value="40" selected>SCH 40</option><option value="80">SCH 80</option></select>
      <button id="finish">Finish run</button>
    </div>
    <div class="group">
      <button id="undo">Undo</button>
      <button id="bomBtn" aria-pressed="true">BOM</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="elev"><button id="down" aria-label="Lower 0.5 m">▼</button><output id="elv">EL +0.000 m</output><button id="up" aria-label="Raise 0.5 m">▲</button></div>
    <aside id="bom" aria-label="Bill of materials"></aside>
    <div id="toast" role="status"></div>
  </main>
  <footer id="status" class="bar"><span id="hint"></span><span id="pos"></span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var OD = { 2: 60.3, 3: 88.9, 4: 114.3, 6: 168.3 };           // mm, ASME B36.10 outside diameter
  var COL = { 2: 0x6aa7c8, 3: 0x8bc7a0, 4: 0xe0b45a, 6: 0xd98b7a };
  var STORE = 'pipedraft.model.v1';
  var STEP = 0.5;                                              // vertical step, m
  var T = THREE;

  var model = { pipes: [], valves: [] };
  var hist = [];
  var tool = 'pipe', curN = 4, curS = 40, cursor = null, elev = 0, sample = true;

  // ---------- storage ----------
  function save() { try { localStorage.setItem(STORE, JSON.stringify(model)); } catch (e) {} }
  function load() {
    try { var s = localStorage.getItem(STORE); if (s) { var m = JSON.parse(s); if (m && m.pipes) { model = m; sample = false; return true; } } } catch (e) {}
    return false;
  }
  function exampleLayout() {
    return {
      pipes: [
        { a: [0, 0, 0], b: [0, 1.5, 0], n: 4 },
        { a: [0, 1.5, 0], b: [0, 1.5, 3], n: 4 },
        { a: [0, 1.5, 3], b: [2.5, 1.5, 3], n: 4 },
        { a: [2.5, 1.5, 3], b: [2.5, 0.8, 3], n: 4 },
        { a: [2.5, 0.8, 3], b: [2.5, 0, 3], n: 3 },
        { a: [0, 1.5, 3], b: [-2, 1.5, 3], n: 4 }
      ],
      valves: [
        { p: [0, 0.8, 0], d: [0, 1, 0], n: 4 },
        { p: [-1.2, 1.5, 3], d: [-1, 0, 0], n: 4 }
      ]
    };
  }

  // ---------- scene ----------
  var cv = $('cv');
  var renderer = new T.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new T.Scene();
  scene.background = new T.Color(0x0d1418);
  var camera = new T.PerspectiveCamera(45, 1, 0.05, 200);
  scene.add(new T.AmbientLight(0xffffff, 0.65));
  var sun = new T.DirectionalLight(0xffffff, 0.8); sun.position.set(6, 12, 8); scene.add(sun);
  var grid = new T.GridHelper(24, 48, 0x34505d, 0x1a262d); scene.add(grid);
  (function axes() {
    [[0xff6b5e, 1, 0, 0], [0x6bd18f, 0, 1, 0], [0x5fa8ff, 0, 0, 1]].forEach(function (a) {
      var g = new T.BufferGeometry().setFromPoints([new T.Vector3(0, 0.002, 0), new T.Vector3(a[1], a[2] + 0.002, a[3])]);
      scene.add(new T.Line(g, new T.LineBasicMaterial({ color: a[0] })));
    });
  })();
  var world = new T.Group(); scene.add(world);

  var ghostLine = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]), new T.LineBasicMaterial({ color: 0xffb21f }));
  ghostLine.visible = false; scene.add(ghostLine);
  var marker = new T.Mesh(new T.SphereGeometry(0.06, 16, 12), new T.MeshBasicMaterial({ color: 0xffb21f }));
  marker.visible = false; scene.add(marker);
  var curMark = new T.Mesh(new T.SphereGeometry(0.09, 16, 12), new T.MeshBasicMaterial({ color: 0xffffff }));
  curMark.visible = false; scene.add(curMark);

  // ---------- camera orbit ----------
  var target = new T.Vector3(1, 0.8, 1.5), theta = 0.8, phi = 1.0, dist = 9;
  function placeCamera() {
    camera.position.set(
      target.x + dist * Math.sin(phi) * Math.sin(theta),
      target.y + dist * Math.cos(phi),
      target.z + dist * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
    camera.updateMatrixWorld();
  }
  function resize() {
    var r = $('stage').getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(r.height, 1);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe($('stage'));

  // ---------- model -> meshes ----------
  var V = function (a) { return new T.Vector3(a[0], a[1], a[2]); };
  var key = function (p) { return p.map(function (v) { return Math.round(v * 1000); }).join(','); };
  var UP = new T.Vector3(0, 1, 0);
  var bom = {}, warns = [];
  // Catalogue dimensions (public ASME data, metres). Elbow = long radius 1.5D (B16.9),
  // tee centre-to-end on the run (B16.9), gate valve face-to-face (B16.10), reducer length.
  var TEE_C = { 2: 0.064, 3: 0.086, 4: 0.105, 6: 0.143 };
  var GATE_FF = { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.267 };
  var RED_L = 0.12, STOCK = 6;
  var CAT = { pipe: 1, stock: 2, elbow: 3, reducer: 4, tee: 5, olet: 6, cross: 7, valve: 8 };
  var lines = {};

  function mat(color, rough) { return new T.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.5 : rough, metalness: 0.25 }); }
  function add(cat, desc, qty, unit) {
    var l = lines[cat + desc] || (lines[cat + desc] = { cat: CAT[cat], desc: desc, qty: 0, unit: unit });
    l.qty += qty;
  }
  function sizeText(a, b) { return a === b ? 'NPS ' + a : 'NPS ' + a + '×' + b; }

  function rebuild() {
    for (var c = world.children.length - 1; c >= 0; c--) {
      var o = world.children[c]; world.remove(o);
      o.traverse(function (m) { if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose(); });
    }
    lines = {}; warns = [];

    // 1. Collect every pipe end into joints (a joint is a point where runs meet).
    var joints = {}, trims = {};
    model.pipes.forEach(function (p, i) {
      var a = V(p.a), b = V(p.b);
      if (a.distanceTo(b) < 0.001) return;
      [['a', p.a, b.clone().sub(a)], ['b', p.b, a.clone().sub(b)]].forEach(function (e) {
        var k = key(e[1]);
        var j = joints[k] || (joints[k] = { pos: e[1], legs: [] });
        j.legs.push({ d: e[2].normalize(), n: p.n, s: p.s || 40, i: i, end: e[0] });
      });
    });
    function setTrim(legs, v) { legs.forEach(function (l) { trims[l.i + l.end] = v; }); }

    // 2. Choose the fitting at each joint, like a spec branch table does, and cut the pipes back.
    Object.keys(joints).forEach(function (k) {
      var j = joints[k], L = j.legs, cnt = L.length;
      var nmax = Math.max.apply(null, L.map(function (l) { return l.n; }));
      j.s = Math.max.apply(null, L.map(function (l) { return l.s; }));
      j.nmax = nmax;
      if (cnt === 2) {
        var dot = L[0].d.dot(L[1].d);
        if (dot < -0.999) {
          if (L[0].n !== L[1].n) { j.type = 'reducer'; setTrim(L, RED_L / 2); }
        } else {
          j.type = 'elbow';
          if (L[0].n !== L[1].n) warns.push('Size change at an elbow, NPS ' + L[0].n + ' to ' + L[1].n + '. Put a reducer on a straight run.');
          j.defl = Math.PI - Math.acos(Math.max(-1, Math.min(1, dot)));
          j.R = 1.5 * nmax * 0.0254;
          j.t = j.R * Math.tan(j.defl / 2);
          setTrim(L, j.t);
        }
      } else if (cnt === 3) {
        var hdr = null, br = null;
        [[0, 1, 2], [0, 2, 1], [1, 2, 0]].forEach(function (c3) {
          if (!hdr && L[c3[0]].d.dot(L[c3[1]].d) < -0.999) { hdr = [L[c3[0]], L[c3[1]]]; br = L[c3[2]]; }
        });
        if (!hdr) { warns.push('Three pipes meet at an angle. Only straight tees and branches are supported.'); return; }
        var nh = Math.max(hdr[0].n, hdr[1].n);
        if (hdr[0].n !== hdr[1].n) warns.push('Header changes size at a branch, NPS ' + hdr[0].n + ' to ' + hdr[1].n + '. Add a reducer.');
        j.hdr = hdr; j.br = br; j.nh = nh;
        if (br.n === nh) { j.type = 'tee'; setTrim(hdr, TEE_C[nh]); setTrim([br], TEE_C[nh]); }
        else if (br.n <= nh / 2) { j.type = 'olet'; setTrim([br], 0.06); }
        else { j.type = 'rtee'; setTrim(hdr, TEE_C[nh]); setTrim([br], TEE_C[br.n]); }
      } else if (cnt >= 4) {
        j.type = 'cross'; setTrim(L, TEE_C[nmax]);
      }
    });

    // 3. Pipes, trimmed to their fittings.
    var total = 0;
    model.pipes.forEach(function (p, i) {
      var a = V(p.a), b = V(p.b), d = b.clone().sub(a), Lp = d.length();
      if (Lp < 0.001) return;
      var dir = d.clone().normalize(), ta = trims[i + 'a'] || 0, tb = trims[i + 'b'] || 0, len = Lp - ta - tb;
      if (len < -0.0005) warns.push('Pipe ' + (i + 1) + ' (' + Math.round(Lp * 1000) + ' mm) is shorter than the fittings at its ends.');
      if (len < 0.001) return;
      var s = p.s || 40, r = OD[p.n] / 2000;
      var m = new T.Mesh(new T.CylinderGeometry(r, r, len, 24), mat(new T.Color(COL[p.n]).multiplyScalar(s === 80 ? 0.72 : 1)));
      m.position.copy(a).addScaledVector(dir, ta + len / 2);
      m.quaternion.setFromUnitVectors(UP, dir);
      m.userData = { kind: 'pipe', i: i };
      world.add(m);
      add('pipe', 'Pipe, NPS ' + p.n + ' SCH ' + s + ', BE', len, 'm');
      total += len;
    });

    // 4. Fittings.
    Object.keys(joints).forEach(function (k) {
      var j = joints[k];
      if (!j.type) return;
      var P = V(j.pos), L = j.legs, n = j.nmax, r = OD[n] / 2000, mesh;
      if (j.type === 'elbow') {
        var d1 = L[0].d, d2 = L[1].d;
        var A = P.clone().addScaledVector(d1, j.t), B = P.clone().addScaledVector(d2, j.t);
        var C = P.clone().addScaledVector(d1.clone().add(d2).normalize(), j.R / Math.cos(j.defl / 2));
        var x = A.clone().sub(C).normalize(), xb = B.clone().sub(C).normalize();
        var z = x.clone().cross(xb).normalize(), y = z.clone().cross(x).normalize();
        mesh = new T.Mesh(new T.TorusGeometry(j.R, r, 16, 28, j.defl), mat(0xc9d6dc, 0.35));
        mesh.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(x, y, z));
        mesh.position.copy(C);
        add('elbow', 'Elbow ' + Math.round(j.defl * 180 / Math.PI) + '° LR BW, NPS ' + n + ' SCH ' + j.s, 1, 'pc');
      } else if (j.type === 'reducer') {
        var big = L[0].n >= L[1].n ? L[0] : L[1], sm = big === L[0] ? L[1] : L[0];
        mesh = new T.Mesh(new T.CylinderGeometry(OD[big.n] / 2000, OD[sm.n] / 2000, RED_L, 24), mat(0xc9d6dc, 0.35));
        mesh.position.copy(P); mesh.quaternion.setFromUnitVectors(UP, big.d);
        add('reducer', 'Reducer concentric BW, ' + sizeText(big.n, sm.n) + ' SCH ' + j.s, 1, 'pc');
      } else if (j.type === 'tee' || j.type === 'rtee') {
        var hd = j.hdr[0].d, rh = OD[j.nh] / 2000, cb = TEE_C[j.br.n], rb = OD[j.br.n] / 2000;
        mesh = new T.Group();
        var body = new T.Mesh(new T.CylinderGeometry(rh * 1.08, rh * 1.08, TEE_C[j.nh] * 2, 24), mat(0xf2f6f8, 0.35));
        body.quaternion.setFromUnitVectors(UP, hd); mesh.add(body);
        var stub = new T.Mesh(new T.CylinderGeometry(rb * 1.08, rb * 1.08, cb, 24), mat(0xf2f6f8, 0.35));
        stub.position.copy(j.br.d).multiplyScalar(cb / 2); stub.quaternion.setFromUnitVectors(UP, j.br.d); mesh.add(stub);
        mesh.position.copy(P);
        add('tee', (j.type === 'tee' ? 'Tee equal' : 'Tee reducing') + ' BW, ' + sizeText(j.nh, j.br.n) + ' SCH ' + j.s, 1, 'pc');
      } else if (j.type === 'olet') {
        mesh = new T.Mesh(new T.CylinderGeometry(OD[j.br.n] / 2000 * 1.4, OD[j.br.n] / 2000 * 1.4, 0.06, 24), mat(0xf2f6f8, 0.35));
        mesh.position.copy(P).addScaledVector(j.br.d, 0.03); mesh.quaternion.setFromUnitVectors(UP, j.br.d);
        add('olet', 'Weldolet BW, ' + sizeText(j.nh, j.br.n) + ' SCH ' + j.s, 1, 'pc');
      } else {
        mesh = new T.Mesh(new T.SphereGeometry(r * 1.5, 20, 14), mat(0xf2f6f8, 0.35)); mesh.position.copy(P);
        add('cross', 'Cross BW, NPS ' + n + ' SCH ' + j.s, 1, 'pc');
      }
      world.add(mesh);
    });

    // 5. Valves sit inline, so their face-to-face length comes off the pipe.
    model.valves.forEach(function (v, i) {
      var r = OD[v.n] / 2000, R = r * 1.9, L = GATE_FF[v.n];
      var g = new T.Group(), bm = mat(0xff6b5e, 0.4);
      var c1 = new T.Mesh(new T.CylinderGeometry(R, 0, L / 2, 20), bm); c1.position.y = -L / 4;
      var c2 = new T.Mesh(new T.CylinderGeometry(0, R, L / 2, 20), bm); c2.position.y = L / 4;
      var st = new T.Mesh(new T.CylinderGeometry(r * 0.22, r * 0.22, R * 2.2, 10), mat(0xc9d6dc)); st.rotation.z = Math.PI / 2; st.position.x = R * 1.1;
      var hw = new T.Mesh(new T.TorusGeometry(R * 0.9, r * 0.12, 8, 24), mat(0xffb21f)); hw.rotation.y = Math.PI / 2; hw.position.x = R * 2.2;
      g.add(c1, c2, st, hw);
      g.position.copy(V(v.p));
      g.quaternion.setFromUnitVectors(UP, V(v.d).normalize());
      g.traverse(function (m) { m.userData = { kind: 'valve', i: i }; });
      world.add(g);
      add('valve', 'Gate valve BW, NPS ' + v.n, 1, 'pc');
      add('pipe', 'Pipe, NPS ' + v.n + ' SCH ' + (v.s || 40) + ', BE', -L, 'm');
      total -= L;
    });
    if (total > 0.001) add('stock', 'Pipe stock, ' + STOCK + ' m lengths (estimate)', Math.ceil(total / STOCK), 'pc');
    renderBom();
    $('undo').disabled = !hist.length;
  }

  // ---------- BOM ----------
  function bomRows() {
    return Object.keys(lines).map(function (k) { return lines[k]; })
      .filter(function (l) { return Math.abs(l.qty) > 0.0005; })
      .sort(function (a, b) { return a.cat - b.cat || (a.desc < b.desc ? -1 : 1); })
      .map(function (l) { return [l.desc, l.unit === 'm' ? l.qty.toFixed(2) + ' m' : String(l.qty)]; });
  }
  function renderBom() {
    var rows = bomRows(), h = '<h2>Bill of materials</h2><p class="empty" style="margin:0 0 8px;font-size:12px">ASME B36.10 pipe · B16.9 butt-weld fittings · carbon steel</p>';
    if (!rows.length) h += '<p class="empty">Nothing drawn yet. Pick Pipe and tap the grid to start a run.</p>';
    else h += '<table>' + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>';
    if (warns.length) h += '<h2 style="margin-top:14px;color:var(--danger)">Check</h2><ul style="margin:0;padding-left:18px;font-size:12.5px">' + warns.map(function (w) { return '<li>' + w + '</li>'; }).join('') + '</ul>';
    h += '<div class="actions"><button id="copy"' + (rows.length ? '' : ' disabled') + '>Copy as text</button></div>';
    $('bom').innerHTML = h;
    var cp = $('copy');
    if (cp) cp.onclick = function () {
      var txt = bomRows().map(function (r) { return r[0] + '\t' + r[1]; }).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
        function () { toast('BOM copied'); }, function () { toast('Copy is blocked here'); });
    };
  }
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 1600);
  }

// ---------- editing ----------
  function pushHist() { hist.push(JSON.stringify(model)); if (hist.length > 100) hist.shift(); }
  function changed() { sample = false; $('mode').textContent = 'My layout'; save(); rebuild(); updateUi(); }
  var r1 = function (v) { return Math.round(v * 10) / 10; };

  var ray = new T.Raycaster(), ndc = new T.Vector2();
  function setRay(e) {
    var r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  }
  function planePoint(e) {
    setRay(e);
    var hit = new T.Vector3();
    return ray.ray.intersectPlane(new T.Plane(new T.Vector3(0, 1, 0), -elev), hit) ? hit : null;
  }
  function snapStart(p) {
    var best = null, bd = 0.3;
    model.pipes.forEach(function (q) {
      [q.a, q.b].forEach(function (e) {
        var d = Math.hypot(e[0] - p.x, e[2] - p.z);
        if (Math.abs(e[1] - elev) < 0.01 && d < bd) { bd = d; best = e; }
      });
    });
    return best ? best.slice() : [r1(p.x), elev, r1(p.z)];
  }
  function constrain(p) {
    var dx = p.x - cursor[0], dz = p.z - cursor[2];
    var useX = Math.abs(dx) >= Math.abs(dz), d = useX ? dx : dz;
    var len = r1(Math.abs(d));
    if (len < 0.1) return null;
    var s = d < 0 ? -1 : 1;
    var q = cursor.slice();
    if (useX) q[0] = Math.round((cursor[0] + s * len) * 1000) / 1000; else q[2] = Math.round((cursor[2] + s * len) * 1000) / 1000;
    return q;
  }
  function pickMeshes(e, filter) {
    setRay(e);
    return ray.intersectObjects(world.children, true).filter(function (h) { return h.object.userData.kind && (!filter || h.object.userData.kind === filter); });
  }

  function onTap(e) {
    if (tool === 'pipe') {
      var p = planePoint(e); if (!p) return;
      if (!cursor) { cursor = snapStart(p); elev = cursor[1]; }
      else {
        var q = constrain(p);
        if (q) { pushHist(); model.pipes.push({ a: cursor, b: q, n: curN, s: curS }); cursor = q; changed(); }
      }
      updateUi(); ghost(e);
    } else if (tool === 'valve') {
      var h = pickMeshes(e, 'pipe')[0]; if (!h) return;
      var pp = model.pipes[h.object.userData.i], a = V(pp.a), b = V(pp.b), L = a.distanceTo(b);
      if (L < 0.5) { toast('Pipe is too short for a valve'); return; }
      var dir = b.clone().sub(a).normalize();
      var s = Math.min(Math.max(Math.round(h.point.clone().sub(a).dot(dir) * 20) / 20, 0.25), L - 0.25);
      var pos = a.clone().add(dir.clone().multiplyScalar(s));
      pushHist();
      model.valves.push({ p: [Math.round(pos.x * 1000) / 1000, Math.round(pos.y * 1000) / 1000, Math.round(pos.z * 1000) / 1000], d: [dir.x, dir.y, dir.z], n: pp.n, s: pp.s || 40 });
      changed();
    } else if (tool === 'del') {
      var hit = pickMeshes(e)[0]; if (!hit) return;
      pushHist();
      if (hit.object.userData.kind === 'pipe') model.pipes.splice(hit.object.userData.i, 1);
      else model.valves.splice(hit.object.userData.i, 1);
      changed();
    }
  }

  function ghost(e) {
    if (tool !== 'pipe') { ghostLine.visible = marker.visible = false; return; }
    var p = planePoint(e), t = null;
    if (p) t = cursor ? constrain(p) : snapStart(p);
    if (t) {
      marker.visible = true; marker.position.set(t[0], t[1], t[2]);
      $('pos').textContent = 'X ' + Math.round(t[0] * 1000) + '  Y ' + Math.round(t[1] * 1000) + '  Z ' + Math.round(t[2] * 1000) + ' mm' + (cursor ? '  L ' + Math.round(new T.Vector3(t[0], t[1], t[2]).distanceTo(V(cursor)) * 1000) + ' mm' : '');
      if (cursor) { ghostLine.visible = true; ghostLine.geometry.setFromPoints([V(cursor), new T.Vector3(t[0], t[1], t[2])]); } else ghostLine.visible = false;
    } else { marker.visible = false; ghostLine.visible = false; }
  }

  function updateUi() {
    ['nav', 'pipe', 'valve', 'del'].forEach(function (t) { $('t-' + t).setAttribute('aria-pressed', String(tool === t)); });
    $('finish').disabled = !cursor;
    $('elv').textContent = 'EL ' + (elev >= 0 ? '+' : '') + elev.toFixed(3) + ' m';
    $('undo').disabled = !hist.length;
    curMark.visible = !!cursor && tool === 'pipe';
    if (cursor) curMark.position.set(cursor[0], cursor[1], cursor[2]);
    var hints = {
      nav: 'Drag to orbit. Two fingers to pan and zoom.',
      pipe: cursor ? 'Tap to extend the run. Pipes snap to X or Z in 100 mm steps. ▲ ▼ add a vertical pipe.' : 'Tap the grid to set a start point, or tap an existing pipe end to branch.',
      valve: 'Tap a pipe to place a valve on it.',
      del: 'Tap a pipe or valve to remove it.'
    };
    $('hint').textContent = hints[tool];
    if (tool !== 'pipe') { ghostLine.visible = marker.visible = false; }
  }

  // ---------- input ----------
  var ptrs = {}, nPtr = 0, down = null, multi = false, pinch = null;
  function pinchState() {
    var k = Object.keys(ptrs), a = ptrs[k[0]], b = ptrs[k[1]];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  function pan(dx, dy) {
    var h = cv.clientHeight, s = 2 * dist * Math.tan(camera.fov * Math.PI / 360) / h;
    var right = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    var up = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
  }
  var lastPen = 0;
  function penNow() { return performance.now() - lastPen < 350; }
  cv.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'pen') lastPen = performance.now();
    else if (e.pointerType === 'touch' && penNow()) return;      // palm resting while the Pencil is in use
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; nPtr++;
    if (e.pointerType === 'pen' && tool !== 'nav') ghost(e);
    if (nPtr === 1) { down = { x: e.clientX, y: e.clientY, moved: false }; multi = false; }
    else { multi = true; if (nPtr === 2) pinch = pinchState(); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'pen') lastPen = performance.now();
    var p = ptrs[e.pointerId];
    if (!p) { if (e.pointerType !== 'touch') ghost(e); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (nPtr === 1 && e.pointerType === 'pen' && tool !== 'nav') { ghost(e); return; }   // Pencil aims, lifting places
    if (nPtr === 1) {
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
      if (down.moved) { theta -= dx * 0.007; phi = Math.min(1.5, Math.max(0.1, phi - dy * 0.007)); }
    } else if (nPtr === 2) {
      var s = pinchState();
      dist = Math.min(60, Math.max(0.8, dist * pinch.d / Math.max(s.d, 1)));
      pan(s.x - pinch.x, s.y - pinch.y);
      pinch = s;
    }
  });
  function end(e) {
    if (!ptrs[e.pointerId]) return;
    if (e.pointerType === 'pen') lastPen = performance.now();
    var pen = e.pointerType === 'pen' && tool !== 'nav';
    var tap = nPtr === 1 && !multi && down && (pen || !down.moved) && e.type === 'pointerup';
    delete ptrs[e.pointerId]; nPtr--;
    if (nPtr === 2) pinch = pinchState();
    if (tap) onTap(e);
  }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', function (e) { e.preventDefault(); dist = Math.min(60, Math.max(0.8, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

  // ---------- controls ----------
  document.querySelectorAll('[data-tool]').forEach(function (b) {
    b.onclick = function () { tool = b.getAttribute('data-tool'); updateUi(); };
  });
  $('nps').onchange = function () { curN = +$('nps').value; };
  $('sched').onchange = function () { curS = +$('sched').value; };
  $('finish').onclick = function () { cursor = null; updateUi(); };
  $('undo').onclick = function () {
    if (!hist.length) return;
    model = JSON.parse(hist.pop()); cursor = null; save(); rebuild(); updateUi();
  };
  $('clear').onclick = function () {
    if ($('clear').dataset.arm !== '1') {
      $('clear').dataset.arm = '1'; $('clear').textContent = 'Tap again';
      setTimeout(function () { $('clear').dataset.arm = ''; $('clear').textContent = 'Clear'; }, 2500);
      return;
    }
    $('clear').dataset.arm = ''; $('clear').textContent = 'Clear';
    pushHist(); model = { pipes: [], valves: [] }; cursor = null; changed();
  };
  $('bomBtn').onclick = function () { var b = $('bom'); b.hidden = !b.hidden; $('bomBtn').setAttribute('aria-pressed', String(!b.hidden)); };
  function vertical(sign) {
    if (cursor) {
      var y = Math.round((cursor[1] + sign * STEP) * 1000) / 1000;
      if (y < 0) return;
      pushHist();
      var q = [cursor[0], y, cursor[2]];
      model.pipes.push({ a: cursor, b: q, n: curN, s: curS }); cursor = q; elev = y; changed();
    } else {
      elev = Math.max(0, Math.round((elev + sign * STEP) * 1000) / 1000); updateUi();
    }
  }
  $('up').onclick = function () { vertical(1); };
  $('down').onclick = function () { vertical(-1); };

  // ---------- iPad niceties ----------
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {                   // Magic Keyboard / Smart Keyboard
    var k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); $('undo').click(); }
    else if (k === 'escape' || k === 'enter') { cursor = null; updateUi(); }
    else if (k === 'n') { tool = 'nav'; updateUi(); }
    else if (k === 'p') { tool = 'pipe'; updateUi(); }
    else if (k === 'v') { tool = 'valve'; updateUi(); }
    else if (k === 'd' || k === 'delete' || k === 'backspace') { tool = 'del'; updateUi(); }
    else if (k === 'arrowup') vertical(1);
    else if (k === 'arrowdown') vertical(-1);
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) {}

  // ---------- boot ----------
  if (!load()) model = exampleLayout();
  $('mode').textContent = sample ? 'Example layout' : 'My layout';
  if ($('bom').hidden === false && window.innerWidth < 900) { $('bom').hidden = true; $('bomBtn').setAttribute('aria-pressed', 'false'); }
  rebuild(); updateUi(); resize();
  (function loop() { placeCamera(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
