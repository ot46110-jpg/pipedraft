<title>PipeDraft 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen CAD viewport. Tool bar and option bar on top, 3D canvas in the middle, status line below. Floating panels sit over the canvas. Single dark drafting look by choice. */
:root {
  --bg: #0d1418;
  --panel: #141d23;
  --line: #25343d;
  --fg: #d5e1e6;
  --dim: #8399a3;
  --accent: #ffb21f;
  --accent-fg: #1a1200;
  --danger: #ff7a6b;
  --paper: #f5f6f4;
  --ink: #14191c;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; }
.bar { background: var(--panel); border-color: var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#top, #opts { display: flex; align-items: center; gap: 12px; overflow-x: auto; }
#top { border-bottom: 1px solid var(--line); padding-block: 8px; }
#opts { border-bottom: 1px solid var(--line); padding-block: 6px; min-height: 0; }
#opts:not(:has(.group:not([hidden]))) { display: none; }
#top::-webkit-scrollbar, #opts::-webkit-scrollbar { display: none; }
.brand { font-weight: 600; letter-spacing: .02em; white-space: nowrap; margin-right: 4px; }
.brand small { display: block; font: 400 10px/1.2 var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.group { display: flex; align-items: center; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); flex: none; }
.group:first-child { border-left: 0; padding-left: 0; }
button, select, input[type="text"] { font: 500 13px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
input[type="text"] { cursor: text; width: 110px; background: var(--bg); -webkit-user-select: text; user-select: text; font-family: var(--font-data); }
button:hover:not(:disabled), select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .35; cursor: default; }
select { background: var(--bg); }
.lbl { font: 400 11px var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; padding-right: 2px; }
#stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.float { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; gap: 4px; }
#views { top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; max-width: calc(100% - 32px); }
#views button { min-width: 44px; padding: 0 10px; }
#elev { bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); align-items: center; }
#elev output { font: 500 12px var(--font-data); color: var(--accent); padding: 0 8px; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
.sheet { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow: auto; max-height: calc(100% - 24px); }
.sheet h2 { margin: 0 0 8px; font: 600 11px var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
#bom { top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(360px, calc(100% - 32px)); }
#bom table { width: 100%; border-collapse: collapse; font: 400 12.5px var(--font-data); font-variant-numeric: tabular-nums; }
#bom td { padding: 6px 0; border-bottom: 1px solid var(--line); }
#bom td:last-child { text-align: right; color: var(--accent); padding-left: 10px; white-space: nowrap; }
.empty { color: var(--dim); font-size: 13px; }
.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
#file { top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(260px, calc(100% - 32px)); z-index: 5; display: flex; flex-direction: column; gap: 6px; }
#file button { text-align: left; }
#insp { bottom: 76px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(320px, calc(100% - 32px)); }
#insp .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
#insp label { display: flex; flex-direction: column; gap: 4px; font: 400 11px var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; flex: 1; min-width: 100px; }
#insp label select, #insp label input { width: 100%; text-transform: none; letter-spacing: 0; }
#insp p { margin: 0 0 10px; font: 400 12.5px var(--font-data); color: var(--fg); }
#iso { inset: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); z-index: 6; display: flex; flex-direction: column; gap: 10px; }
#iso header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#iso header h2 { margin: 0 auto 0 0; }
#isoSheet { flex: 1; min-height: 0; background: var(--paper); border-radius: 6px; overflow: auto; }
#isoSheet svg { display: block; width: 100%; height: 100%; min-height: 320px; }
#status { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-block: 8px; font: 400 12px var(--font-data); color: var(--dim); }
#status span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status #pos { color: var(--fg); flex: none; }
#toast { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 6px; padding: 8px 14px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 9; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
/* iPad: full-screen standalone, no rubber-band or callouts, roomy touch targets */
html { overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
#top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
#status { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
@media (pointer: coarse) { button, select, input[type="text"] { min-height: 48px; min-width: 48px; } }
</style>

<div id="app">
  <header id="top" class="bar">
    <div class="brand">PipeDraft 3D<small id="mode">Example layout</small></div>
    <div class="group" role="group" aria-label="Tools">
      <button id="t-nav" data-tool="nav" aria-pressed="false">Navigate</button>
      <button id="t-sel" data-tool="sel" aria-pressed="false">Select</button>
      <button id="t-pipe" data-tool="pipe" aria-pressed="true">Pipe</button>
      <button id="t-valve" data-tool="valve" aria-pressed="false">Valve</button>
      <button id="t-flange" data-tool="flange" aria-pressed="false">Flange</button>
      <button id="t-cap" data-tool="cap" aria-pressed="false">Cap</button>
      <button id="t-equip" data-tool="equip" aria-pressed="false">Equipment</button>
      <button id="t-measure" data-tool="measure" aria-pressed="false">Measure</button>
      <button id="t-del" data-tool="del" aria-pressed="false">Delete</button>
    </div>
    <div class="group">
      <button id="undo">Undo</button>
      <button id="isoBtn">Iso sheet</button>
      <button id="bomBtn" aria-pressed="true">BOM</button>
      <button id="fileBtn" aria-pressed="false">File</button>
    </div>
  </header>
  <div id="opts" class="bar">
    <div class="group" data-for="pipe">
      <select id="nps" aria-label="Pipe size">
        <option value="2">NPS 2 · 60.3 mm</option>
        <option value="3">NPS 3 · 88.9 mm</option>
        <option value="4" selected>NPS 4 · 114.3 mm</option>
        <option value="6">NPS 6 · 168.3 mm</option>
      </select>
      <select id="sched" aria-label="Schedule"><option value="40" selected>SCH 40</option><option value="80">SCH 80</option></select>
      <input type="text" id="ln" value="L-001" maxlength="12" aria-label="Line number" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="group" data-for="pipe">
      <span class="lbl">Snap</span>
      <select id="snap" aria-label="Grid snap"><option value="0.05">50 mm</option><option value="0.1" selected>100 mm</option><option value="0.25">250 mm</option></select>
      <button id="ang" aria-pressed="false" aria-label="Allow 45 degree turns">45° turns</button>
      <button id="finish">Finish run</button>
    </div>
    <div class="group" data-for="valve">
      <span class="lbl">Type</span>
      <select id="vk" aria-label="Valve type"><option value="gate" selected>Gate</option><option value="globe">Globe</option><option value="check">Check</option><option value="ball">Ball</option></select>
    </div>
    <div class="group" data-for="equip">
      <span class="lbl">Item</span>
      <select id="eqk" aria-label="Equipment"><option value="pump" selected>Centrifugal pump</option><option value="vessel">Vertical vessel</option></select>
      <button id="rot">Rotate 90°</button>
    </div>
  </div>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="views" class="float" role="group" aria-label="Views">
      <button id="v-iso">Iso</button><button id="v-top">Top</button><button id="v-front">Front</button><button id="v-right">Right</button>
      <button id="v-fit">Fit</button><button id="ortho" aria-pressed="false">Ortho</button><button id="dims" aria-pressed="false">Dims</button>
    </div>
    <div id="elev" class="float"><button id="down" aria-label="Lower 0.5 m">▼</button><output id="elv">EL +0.000 m</output><button id="up" aria-label="Raise 0.5 m">▲</button></div>
    <div id="insp" class="sheet" hidden></div>
    <aside id="bom" class="sheet" aria-label="Bill of materials"></aside>
    <div id="file" class="sheet" hidden>
      <h2>File</h2>
      <button id="f-save">Save project (.json)</button>
      <button id="f-open">Open project</button>
      <button id="f-csv">Export BOM (.csv)</button>
      <button id="f-dxf">Export centrelines (.dxf)</button>
      <button id="f-png">Save image (.png)</button>
      <button id="f-clear">Clear everything</button>
      <input type="file" id="openf" accept=".json,application/json" hidden>
    </div>
    <section id="iso" class="sheet" hidden aria-label="Isometric sheet">
      <header><h2>Isometric sheet</h2><button id="iso-save">Save .svg</button><button id="iso-close">Close</button></header>
      <div id="isoSheet"></div>
    </section>
    <div id="toast" role="status"></div>
  </main>
  <footer id="status" class="bar"><span id="hint"></span><span id="pos"></span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = THREE;

  // ---------- catalogue data ----------
  // Dimensions are public ASME values written from memory (B36.10 pipe, B16.9 butt-weld fittings,
  // B16.5 class 150 flanges, B16.10 valves). Treat them as unverified until checked against the standard.
  var SIZES = {
    2: { od: 60.3, wt: { 40: 3.91, 80: 5.54 } },
    3: { od: 88.9, wt: { 40: 5.49, 80: 7.62 } },
    4: { od: 114.3, wt: { 40: 6.02, 80: 8.56 } },
    6: { od: 168.3, wt: { 40: 7.11, 80: 10.97 } }
  };
  var OD = {}; Object.keys(SIZES).forEach(function (n) { OD[n] = SIZES[n].od; });
  var COL = { 2: 0x6aa7c8, 3: 0x8bc7a0, 4: 0xe0b45a, 6: 0xd98b7a };
  var TEE_C = { 2: 0.064, 3: 0.086, 4: 0.105, 6: 0.143 };           // tee centre to end, m
  var CAP_E = { 2: 0.038, 3: 0.051, 4: 0.064, 6: 0.089 };           // cap length, m
  var FL = { 2: [0.1524, 0.0191], 3: [0.1905, 0.0239], 4: [0.2286, 0.0239], 6: [0.2794, 0.0254] };   // flange OD, thickness, m
  var BOLTS = { 2: '4× 5/8"', 3: '4× 5/8"', 4: '8× 5/8"', 6: '8× 3/4"' };
  var VALVE_FF = {                                                  // face to face, m
    gate: { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.267 },
    globe: { 2: 0.203, 3: 0.241, 4: 0.292, 6: 0.406 },
    check: { 2: 0.203, 3: 0.241, 4: 0.292, 6: 0.356 },
    ball: { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.394 }
  };
  var VALVE_NAME = { gate: 'Gate valve', globe: 'Globe valve', check: 'Check valve', ball: 'Ball valve' };
  var RED_L = 0.12, STOCK = 6, STEEL = 7850, STEP = 0.5;
  var STORE = 'pipedraft.model.v1';

  var EQUIP = {
    pump: {
      name: 'Centrifugal pump',
      noz: [{ p: [-0.35, 0.4, 0], d: [-1, 0, 0], n: 4 }, { p: [-0.15, 0.7, 0], d: [0, 1, 0], n: 3 }],
      build: function (g, m) {
        var base = new T.Mesh(new T.BoxGeometry(1.5, 0.08, 0.55), m); base.position.set(0.2, 0.04, 0); g.add(base);
        var cas = new T.Mesh(new T.CylinderGeometry(0.3, 0.3, 0.4, 28), m); cas.rotation.z = Math.PI / 2; cas.position.set(-0.15, 0.4, 0); g.add(cas);
        var mot = new T.Mesh(new T.CylinderGeometry(0.22, 0.22, 0.8, 28), mat(0x3d5361, 0.6)); mot.rotation.z = Math.PI / 2; mot.position.set(0.45, 0.4, 0); g.add(mot);
      }
    },
    vessel: {
      name: 'Vertical vessel',
      noz: [{ p: [0, 2.55, 0], d: [0, 1, 0], n: 4 }, { p: [0.6, 1.8, 0], d: [1, 0, 0], n: 4 }, { p: [0, 0.4, 0.6], d: [0, 0, 1], n: 4 }],
      build: function (g, m) {
        var body = new T.Mesh(new T.CylinderGeometry(0.6, 0.6, 2.4, 32), m); body.position.y = 1.2; g.add(body);
        var dome = new T.Mesh(new T.SphereGeometry(0.6, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), m); dome.scale.y = 0.25; dome.position.y = 2.4; g.add(dome);
      }
    }
  };

  // ---------- state ----------
  var model = blank(), hist = [];
  var tool = 'pipe', curN = 4, curS = 40, curL = 'L-001', snap = 0.1, ang45 = false, vk = 'gate', eqk = 'pump', curRot = 0;
  var cursor = null, elev = 0, sample = true, sel = null, mA = null, showDims = false, orthoOn = false;

  function blank() { return { pipes: [], valves: [], flanges: [], caps: [], equip: [] }; }
  function normalize(m) {
    var o = blank();
    if (!m || !Array.isArray(m.pipes)) return o;
    o.pipes = m.pipes.map(function (p) { p.s = p.s || 40; p.ln = p.ln || 'L-001'; return p; });
    o.valves = (m.valves || []).map(function (v) { v.s = v.s || 40; v.k = v.k || 'gate'; return v; });
    o.flanges = (m.flanges || []).map(function (f) { f.s = f.s || 40; return f; });
    o.caps = m.caps || []; o.equip = m.equip || [];
    return o;
  }

  // ---------- storage ----------
  function save() { try { localStorage.setItem(STORE, JSON.stringify(model)); } catch (e) {} }
  function load() {
    try { var s = localStorage.getItem(STORE); if (s) { var m = JSON.parse(s); if (m && m.pipes) { model = normalize(m); sample = false; return true; } } } catch (e) {}
    return false;
  }
  function exampleLayout() {
    return normalize({
      pipes: [
        { a: [0, 0, 0], b: [0, 1.5, 0], n: 4 },
        { a: [0, 1.5, 0], b: [0, 1.5, 3], n: 4 },
        { a: [0, 1.5, 3], b: [2.5, 1.5, 3], n: 4 },
        { a: [2.5, 1.5, 3], b: [2.5, 0.8, 3], n: 4 },
        { a: [2.5, 0.8, 3], b: [2.5, 0, 3], n: 3 },
        { a: [0, 1.5, 3], b: [-2, 1.5, 3], n: 4 }
      ],
      valves: [
        { p: [0, 0.8, 0], d: [0, 1, 0], n: 4 },
        { p: [-1.2, 1.5, 3], d: [-1, 0, 0], n: 4 }
      ]
    });
  }

  // ---------- scene ----------
  var cv = $('cv');
  var renderer = new T.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new T.Scene();
  scene.background = new T.Color(0x0d1418);
  var camP = new T.PerspectiveCamera(45, 1, 0.05, 300);
  var camO = new T.OrthographicCamera(-5, 5, 5, -5, 0.01, 500);
  var camera = camP;
  scene.add(new T.AmbientLight(0xffffff, 0.65));
  var sun = new T.DirectionalLight(0xffffff, 0.8); sun.position.set(6, 12, 8); scene.add(sun);
  scene.add(new T.GridHelper(24, 48, 0x34505d, 0x1a262d));
  [[0xff6b5e, 1, 0, 0], [0x6bd18f, 0, 1, 0], [0x5fa8ff, 0, 0, 1]].forEach(function (a) {
    var g = new T.BufferGeometry().setFromPoints([new T.Vector3(0, 0.002, 0), new T.Vector3(a[1], a[2] + 0.002, a[3])]);
    scene.add(new T.Line(g, new T.LineBasicMaterial({ color: a[0] })));
  });
  var world = new T.Group(); scene.add(world);

  var ghostLine = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]), new T.LineBasicMaterial({ color: 0xffb21f }));
  ghostLine.visible = false; scene.add(ghostLine);
  var marker = new T.Mesh(new T.SphereGeometry(0.06, 16, 12), new T.MeshBasicMaterial({ color: 0xffb21f }));
  marker.visible = false; scene.add(marker);
  var curMark = new T.Mesh(new T.SphereGeometry(0.09, 16, 12), new T.MeshBasicMaterial({ color: 0xffffff }));
  curMark.visible = false; scene.add(curMark);
  var measLine = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]), new T.LineBasicMaterial({ color: 0xffffff }));
  measLine.visible = false; scene.add(measLine);

  // ---------- camera ----------
  var target = new T.Vector3(1, 0.8, 1.5), theta = 0.8, phi = 1.0, dist = 9;
  function placeCamera() {
    camera = orthoOn ? camO : camP;
    camera.position.set(
      target.x + dist * Math.sin(phi) * Math.sin(theta),
      target.y + dist * Math.cos(phi),
      target.z + dist * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
    if (orthoOn) {
      var hh = dist * Math.tan(camP.fov * Math.PI / 360), hw = hh * camP.aspect;
      camO.left = -hw; camO.right = hw; camO.top = hh; camO.bottom = -hh; camO.updateProjectionMatrix();
    }
    camera.updateMatrixWorld();
  }
  function resize() {
    var r = $('stage').getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camP.aspect = r.width / Math.max(r.height, 1);
    camP.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe($('stage'));
  function setView(name) {
    var v = { iso: [0.785, 0.95], top: [0.785, 0.03], front: [0, 1.5707], right: [1.5707, 1.5707] }[name];
    theta = v[0]; phi = v[1];
  }
  function fit() {
    var box = new T.Box3();
    world.traverse(function (o) { if (o.geometry && o.userData.kind) box.expandByObject(o); });
    if (box.isEmpty()) { target.set(1, 0.8, 1.5); dist = 9; return; }
    var c = box.getCenter(new T.Vector3()), s = box.getSize(new T.Vector3());
    target.copy(c);
    dist = Math.min(60, Math.max(2, Math.max(s.x, s.y, s.z, 1.5) / (2 * Math.tan(camP.fov * Math.PI / 360)) * 1.5));
  }

  // ---------- helpers ----------
  var V = function (a) { return new T.Vector3(a[0], a[1], a[2]); };
  var key = function (p) { return p.map(function (v) { return Math.round(v * 1000); }).join(','); };
  var UP = new T.Vector3(0, 1, 0);
  var mm3 = function (v) { return [Math.round(v.x * 1000) / 1000, Math.round(v.y * 1000) / 1000, Math.round(v.z * 1000) / 1000]; };
  var rs = function (v) { return Math.round(v / snap) * snap; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function mat(color, rough) { return new T.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.5 : rough, metalness: 0.25 }); }
  function lineWeight(n, s) {                                       // kg per metre of steel pipe
    var od = SIZES[n].od / 1000, id = od - 2 * SIZES[n].wt[s] / 1000;
    return Math.PI / 4 * (od * od - id * id) * STEEL;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function segDist(p1, q1, p2, q2) {
    var d1 = q1.clone().sub(p1), d2 = q2.clone().sub(p2), r = p1.clone().sub(p2);
    var a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r), s, t;
    if (a <= 1e-9 && e <= 1e-9) return r.length();
    if (a <= 1e-9) { s = 0; t = clamp(f / e, 0, 1); }
    else {
      var c = d1.dot(r);
      if (e <= 1e-9) { t = 0; s = clamp(-c / a, 0, 1); }
      else {
        var b = d1.dot(d2), den = a * e - b * b;

  // ---------- model -> meshes ----------
  var CAT = { equip: 0, pipe: 1, stock: 2, elbow: 3, reducer: 4, tee: 5, olet: 6, cross: 7, cap: 8, flange: 9, valve: 10, weight: 11 };
  var lines = {}, warns = [], nozList = [];
  function add(cat, desc, qty, unit) {
    var l = lines[cat + desc] || (lines[cat + desc] = { cat: CAT[cat], desc: desc, qty: 0, unit: unit });
    l.qty += qty;
  }
  function sizeText(a, b) { return a === b ? 'NPS ' + a : 'NPS ' + a + '×' + b; }
  function equipNozzles(e) {
    var rot = (e.r || 0) * Math.PI / 2;
    return EQUIP[e.k].noz.map(function (z) {
      return { p: V(z.p).applyAxisAngle(UP, rot).add(V(e.p)), d: V(z.d).applyAxisAngle(UP, rot), n: z.n };
    });
  }

  function rebuild() {
    for (var c = world.children.length - 1; c >= 0; c--) {
      var o = world.children[c]; world.remove(o);
      o.traverse(function (m) {
        if (m.geometry) m.geometry.dispose();
        if (m.material) { if (m.material.map) m.material.map.dispose(); m.material.dispose(); }
      });
    }
    lines = {}; warns = []; nozList = [];
    var weight = 0;

    // 1. Equipment and its nozzles.
    model.equip.forEach(function (e, i) {
      var def = EQUIP[e.k]; if (!def) return;
      var g = new T.Group(), m = mat(0x5f7a88, 0.6);
      def.build(g, m);
      def.noz.forEach(function (z) {
        var s = new T.Mesh(new T.CylinderGeometry(OD[z.n] / 2000 * 1.4, OD[z.n] / 2000 * 1.4, 0.12, 20), mat(0xc9d6dc, 0.4));
        s.position.copy(V(z.p)).addScaledVector(V(z.d), -0.06); s.quaternion.setFromUnitVectors(UP, V(z.d)); g.add(s);
      });
      g.position.copy(V(e.p)); g.rotation.y = (e.r || 0) * Math.PI / 2;
      g.traverse(function (x) { x.userData = { kind: 'equip', i: i }; });
      world.add(g);
      equipNozzles(e).forEach(function (z) { nozList.push(z); });
      add('equip', def.name, 1, 'pc');
    });

    // 2. Collect every pipe end into joints.
    var joints = {}, trims = {}, capKeys = {};
    model.caps.forEach(function (p) { capKeys[key(p)] = true; });
    model.pipes.forEach(function (p, i) {
      var a = V(p.a), b = V(p.b);
      if (a.distanceTo(b) < 0.001) return;
      [['a', p.a, b.clone().sub(a)], ['b', p.b, a.clone().sub(b)]].forEach(function (e) {
        var k = key(e[1]);
        var j = joints[k] || (joints[k] = { pos: e[1], legs: [] });
        j.legs.push({ d: e[2].normalize(), n: p.n, s: p.s || 40, i: i, end: e[0] });
      });
    });
    function setTrim(legs, v) { legs.forEach(function (l) { trims[l.i + l.end] = v; }); }

    // 3. Choose the fitting at each joint, like a spec branch table, and cut the pipes back.
    Object.keys(joints).forEach(function (k) {
      var j = joints[k], L = j.legs, cnt = L.length;
      var nmax = Math.max.apply(null, L.map(function (l) { return l.n; }));
      j.s = Math.max.apply(null, L.map(function (l) { return l.s; }));
      j.nmax = nmax;
      if (cnt === 1) {
        if (capKeys[k]) { j.type = 'cap'; setTrim(L, CAP_E[nmax]); }
      } else if (cnt === 2) {
        var dot = L[0].d.dot(L[1].d);
        if (dot < -0.999) {
          if (L[0].n !== L[1].n) { j.type = 'reducer'; setTrim(L, RED_L / 2); }
        } else {
          j.type = 'elbow';
          if (L[0].n !== L[1].n) warns.push('Size change at an elbow, NPS ' + L[0].n + ' to ' + L[1].n + '. Put a reducer on a straight run.');
          j.defl = Math.PI - Math.acos(clamp(dot, -1, 1));

        j.hdr = hdr; j.br = br; j.nh = nh;
        if (br.n === nh) { j.type = 'tee'; setTrim(hdr, TEE_C[nh]); setTrim([br], TEE_C[nh]); }
        else if (br.n <= nh / 2) { j.type = 'olet'; setTrim([br], 0.06); }
        else { j.type = 'rtee'; setTrim(hdr, TEE_C[nh]); setTrim([br], TEE_C[br.n]); }

    });

    model.pipes.forEach(function (p, i) {

      add('pipe', 'Pipe, NPS ' + p.n + ' SCH ' + s + ', BE', len, 'm');
      total += len; weight += len * lineWeight(p.n, s);

    // 5. Clash check between pipes that do not share a joint.

    for (var x = 0; x < model.pipes.length; x++) {

        body.quaternion.setFromUnitVectors(UP, hd); mesh.add(body);

        mesh.position.copy(P).addScaledVector(j.br.d, 0.03); mesh.quaternion.setFromUnitVectors(UP, j.br.d);
        add('olet', 'Weldolet BW, ' + sizeText(j.nh, j.br.n) + ' SCH ' + j.s, 1, 'pc');

      g.traverse(function (m) { m.userData = { kind: 'valve', i: i }; });
      world.add(g);
      add('valve', VALVE_NAME[kind] + ' flanged 150#, NPS ' + v.n, 1, 'pc');
      add('pipe', 'Pipe, NPS ' + v.n + ' SCH ' + (v.s || 40) + ', BE', -L, 'm');

    model.flanges.forEach(function (f, i) {

  }

  // ---------- BOM ----------
  function bomRows() {
    return Object.keys(lines).map(function (k) { return lines[k]; })
      .filter(function (l) { return Math.abs(l.qty) > 0.0005; })
      .sort(function (a, b) { return a.cat - b.cat || (a.desc < b.desc ? -1 : 1); })
      .map(function (l) { return [l.desc, l.unit === 'm' ? l.qty.toFixed(2) + ' m' : l.unit === 'kg' ? l.qty.toFixed(1) + ' kg' : String(l.qty)]; });
  }
  function renderBom() {
    var rows = bomRows(), h = '<h2>Bill of materials</h2><p class="empty" style="margin:0 0 8px;font-size:12px">ASME B36.10 pipe · B16.9 butt-weld fittings · carbon steel</p>';
    if (!rows.length) h += '<p class="empty">Nothing drawn yet. Pick Pipe and tap the grid to start a run.</p>';
    else h += '<table>' + rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>';
    if (warns.length) h += '<h2 style="margin-top:14px;color:var(--danger)">Check</h2><ul style="margin:0;padding-left:18px;font-size:12.5px">' + warns.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    h += '<div class="actions"><button id="copy"' + (rows.length ? '' : ' disabled') + '>Copy as text</button></div>';
    $('bom').innerHTML = h;
    var cp = $('copy');
    if (cp) cp.onclick = function () {
      var txt = bomRows().map(function (r) { return r[0] + '\t' + r[1]; }).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
        function () { toast('BOM copied'); }, function () { toast('Copy is blocked here'); });
    };
  }
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  // ---------- editing ----------
  function pushHist() { hist.push(JSON.stringify(model)); if (hist.length > 100) hist.shift(); }
  function changed() { sample = false; $('mode').textContent = 'My layout'; save(); rebuild(); updateUi(); }

  function splitAt(pt) {                                            // make a joint where a pipe end lands on another pipe
    var P = V(pt), did = false;
    for (var i = 0; i < model.pipes.length; i++) {
      var p = model.pipes[i], a = V(p.a), b = V(p.b), ab = b.clone().sub(a), L2 = ab.lengthSq();
      if (L2 < 1e-9) continue;
      var t = P.clone().sub(a).dot(ab) / L2;
      if (t <= 0.0005 || t >= 0.9995) continue;
      if (a.clone().addScaledVector(ab, t).distanceTo(P) > 0.002) continue;
      var m = mm3(P), q = { a: m, b: p.b, n: p.n, s: p.s, ln: p.ln };
      p.b = m; model.pipes.splice(i + 1, 0, q); did = true; i++;
    }
    return did;
  }
  function addPipe(a, b, n, s, ln) {
    model.pipes.push({ a: a, b: b, n: n, s: s || 40, ln: ln || 'L-001' });
    splitAt(b); splitAt(a);
  }

  var ray = new T.Raycaster(), ndc = new T.Vector2();
  function setRay(e) {
    var r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  }
  function planePoint(e) {
    setRay(e);
    var hit = new T.Vector3();
    return ray.ray.intersectPlane(new T.Plane(new T.Vector3(0, 1, 0), -elev), hit) ? hit : null;
  }
  function pickMeshes(e, kind) {
    setRay(e); world.updateMatrixWorld(true);
    return ray.intersectObjects(world.children, true).filter(function (h) { return h.object.userData.kind && (!kind || h.object.userData.kind === kind); });
  }
  function snapPoint(p) {                                           // existing pipe end or equipment nozzle near the tap
    var best = null, bd = 0.3;
    model.pipes.forEach(function (q) {
      [q.a, q.b].forEach(function (e) {
        var d = Math.hypot(e[0] - p.x, e[2] - p.z);
        if (Math.abs(e[1] - elev) < 0.01 && d < bd) { bd = d; best = e.slice(); }
      });
    });
    nozList.forEach(function (z) {
      var d = z.p.distanceTo(new T.Vector3(p.x, elev, p.z));
      if (d < bd) { bd = d; best = mm3(z.p); }
    });
    return best;
  }
  function onPipe(hit) {                                            // point on a pipe under the tap, snapped along its length
    var p = model.pipes[hit.object.userData.i]; if (!p) return null;
    var a = V(p.a), b = V(p.b), L = a.distanceTo(b), dir = b.clone().sub(a).normalize();
    var s = clamp(Math.round(hit.point.clone().sub(a).dot(dir) / snap) * snap, 0, L);
    if (s < 0.04) s = 0; if (L - s < 0.04) s = L;
    return { pt: mm3(a.clone().addScaledVector(dir, s)), pipe: p, dir: dir, s: s, L: L };
  }
  function constrain(p) {
    var dx = p.x - cursor[0], dz = p.z - cursor[2], q = cursor.slice(), ux, uz, len;
    if (ang45) {
      var an = Math.round(Math.atan2(dz, dx) / (Math.PI / 4)) * (Math.PI / 4);
      ux = Math.cos(an); uz = Math.sin(an);
      len = rs(dx * ux + dz * uz);

    $('isoSheet').innerHTML = svg || '<p style="padding:24px;color:#14191c">Draw some pipe first.</p>';
    $('iso').hidden = false;
  };
  $('iso-close').onclick = function () { $('iso').hidden = true; };
  $('iso-save').onclick = function () { var s = isoSvg(); if (s) saveBlob('pipedraft-iso.svg', new Blob([s], { type: 'image/svg+xml' })); else toast('Nothing to save'); };
  $('f-save').onclick = function () { saveBlob('pipedraft.json', new Blob([JSON.stringify({ app: 'pipedraft', version: 2, model: model }, null, 1)], { type: 'application/json' })); };
  $('f-open').onclick = function () { $('openf').click(); };
  $('openf').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result), m = d && d.model ? d.model : d;
        if (!m || !Array.isArray(m.pipes)) throw new Error('bad');
        pushHist(); model = normalize(m); cursor = null; sel = null; changed(); fit(); toast('Project opened');
      } catch (x) { toast('That file is not a PipeDraft project'); }
    };
    rd.readAsText(f); this.value = '';
  };
  $('f-csv').onclick = function () { saveBlob('pipedraft-bom.csv', new Blob([csv()], { type: 'text/csv' })); };
  $('f-dxf').onclick = function () { saveBlob('pipedraft.dxf', new Blob([dxf()], { type: 'application/dxf' })); };
  $('f-png').onclick = function () { renderer.render(scene, camera); cv.toBlob(function (b) { if (b) saveBlob('pipedraft.png', b); }); };
  $('f-clear').onclick = function () {
    var b = $('f-clear');
    if (b.dataset.arm !== '1') {
      b.dataset.arm = '1'; b.textContent = 'Tap again to clear';
      setTimeout(function () { b.dataset.arm = ''; b.textContent = 'Clear everything'; }, 2500);
      return;
    }
    b.dataset.arm = ''; b.textContent = 'Clear everything';
    pushHist(); model = blank(); cursor = null; sel = null; changed();
  };

  // ---------- iPad niceties ----------
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {                 // Magic Keyboard / Smart Keyboard
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
    var k = e.key.toLowerCase();
    if (e.metaKey || e.ctrlKey) { if (k === 'z') { e.preventDefault(); $('undo').click(); } return; }
    var map = { n: 'nav', s: 'sel', p: 'pipe', v: 'valve', f: 'flange', c: 'cap', e: 'equip', m: 'measure', d: 'del', delete: 'del', backspace: 'del' };
    if (k === 'escape' || k === 'enter') { cursor = null; sel = null; mA = null; rebuild(); updateUi(); }
    else if (map[k]) setTool(map[k]);
    else if (k === 'arrowup') vertical(1);
    else if (k === 'arrowdown') vertical(-1);
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) {}

  // Hook for the headless tests in test/.
  window.PipeDraft = {
    load: function (m) { model = normalize(m); sel = null; rebuild(); },
    get model() { return model; },
    addPipe: addPipe, rebuild: rebuild, rows: bomRows, warns: function () { return warns; },
    nozzles: function () { return nozList; }, iso: isoSvg, dxf: dxf, csv: csv,
    project: function (p) { var r = cv.getBoundingClientRect(), v = V(p).project(camera); return { x: (v.x + 1) / 2 * r.width + r.left, y: (1 - v.y) / 2 * r.height + r.top }; }
  };

  // ---------- boot ----------
  if (!load()) model = exampleLayout();
  $('mode').textContent = sample ? 'Example layout' : 'My layout';
  if (window.innerWidth < 900) { $('bom').hidden = true; $('bomBtn').setAttribute('aria-pressed', 'false'); }
  rebuild(); updateUi(); resize();
  (function loop() { placeCamera(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
