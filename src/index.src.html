<title>PipeDraft 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D canvas fills the screen. A slim header holds the view and project actions. A left rail holds six tools, a parts palette opens beside it, a small context bar sits at the bottom centre, and the side column on the right holds only what was opened. Single dark drafting look by choice. */
:root {
  --bg: #0d1418;
  --panel: #141d23;
  --raise: #1a262d;
  --line: #25343d;
  --fg: #d5e1e6;
  --dim: #8399a3;
  --accent: #ffb21f;
  --accent-fg: #1a1200;
  --danger: #ff7a6b;
  --paper: #f5f6f4;
  --ink: #14191c;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --gutter-l: max(14px, env(safe-area-inset-left, 0px));
  --gutter-r: max(14px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; }
button, select, input[type="text"] { font: 500 14px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 10px; min-height: 48px; min-width: 48px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
input[type="text"] { cursor: text; background: var(--bg); -webkit-user-select: text; user-select: text; font-family: var(--font-data); width: 100%; }
select { background: var(--bg); width: 100%; }
button:hover:not(:disabled), select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .35; cursor: default; }
.bar { background: var(--panel); border-color: var(--line); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
#top { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-block: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); overflow-x: auto; }
#top::-webkit-scrollbar { display: none; }
#top > * { flex: none; }
.grow { flex: 1 !important; }
.brand { font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font: 400 10px/1.2 var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
#stage { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.float, .sheet { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.float { padding: 6px; display: flex; gap: 6px; align-items: center; }
.sheet { padding: 14px; overflow: auto; max-height: calc(100% - 24px); }
.sheet h2 { margin: 0 0 10px; font: 600 11px var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.empty { color: var(--dim); font-size: 13px; }
.actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font: 400 11px var(--font-data); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; flex: 1; min-width: 110px; }
.field select, .field input { text-transform: none; letter-spacing: 0; font-family: var(--font-ui); }
.field input { font-family: var(--font-data); }
/* left tool rail */
#rail { left: var(--gutter-l); top: 12px; flex-direction: column; }
#rail button { width: 66px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; font-size: 11px; border-color: transparent; }
#rail svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* parts palette */
#parts { left: calc(var(--gutter-l) + 82px); top: 12px; width: min(460px, calc(100% - 120px - var(--gutter-l) - var(--gutter-r))); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.tabs button { flex: none; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.chips button { white-space: normal; line-height: 1.2; min-height: 54px; text-align: center; }
/* context bar and pipe settings */
#ctx { bottom: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 160px); overflow-x: auto; }
#ctx:not(:has([data-for]:not([hidden]))) { display: none; }
#ctx [data-for] { display: flex; gap: 6px; }
#psum { font-family: var(--font-data); font-size: 13px; }
#pset { bottom: 78px; left: 50%; transform: translateX(-50%); width: min(400px, calc(100% - 32px)); z-index: 5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* elevation */
#elev { right: var(--gutter-r); bottom: 12px; flex-direction: column; width: 70px; }
#elev button { width: 100%; }
#elev output { font: 500 12px/1.2 var(--font-data); color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; padding: 2px 0; }
/* right column */
#side { position: absolute; top: 12px; right: var(--gutter-r); bottom: 190px; width: min(340px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 12px; overflow: auto; pointer-events: none; }
#side .sheet { position: static; flex: none; pointer-events: auto; max-height: none; }
#insp p { margin: 0 0 10px; font: 400 12.5px var(--font-data); color: var(--fg); }
#bom table { width: 100%; border-collapse: collapse; font: 400 12.5px var(--font-data); font-variant-numeric: tabular-nums; }
#bom td { padding: 6px 0; border-bottom: 1px solid var(--line); }
#bom td:last-child { text-align: right; color: var(--accent); padding-left: 10px; white-space: nowrap; }
/* more menu */
#more { top: 12px; right: var(--gutter-r); width: min(280px, calc(100% - 32px)); z-index: 7; display: flex; flex-direction: column; gap: 6px; padding: 10px; }
#more button { text-align: left; width: 100%; }
#more hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
/* isometric sheet */
#iso { inset: 12px var(--gutter-r) 12px var(--gutter-l); z-index: 6; display: flex; flex-direction: column; gap: 10px; max-height: none; }
#iso header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#iso header h2 { margin: 0 auto 0 0; }
#isoSheet { flex: 1; min-height: 0; background: var(--paper); border-radius: 8px; overflow: auto; }
#isoSheet svg { display: block; width: 100%; height: 100%; min-height: 320px; }
#status { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-block: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); font: 400 12px var(--font-data); color: var(--dim); }
#status span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status #pos { color: var(--fg); flex: none; }
#toast { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 10px 16px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 9; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
/* iPad: full-screen standalone, no rubber-band or callouts */
html { overscroll-behavior: none; }
body { position: fixed; inset: 0; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
/* narrow windows: palette and side column stack over the canvas */
@media (max-width: 760px) { #parts { width: calc(100% - 120px); } #side { bottom: 12px; } #elev { display: none; } }
</style></style>

<div id="app">
  <header id="top" class="bar">
    <div class="brand">PipeDraft 3D<small id="mode">Example layout</small></div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button id="v-iso">Iso</button><button id="v-top">Top</button><button id="v-front">Front</button><button id="v-right">Right</button>
    </div>
    <button id="v-fit" aria-label="Fit drawing to screen">Fit</button>
    <span class="grow"></span>
    <button id="undo">Undo</button>
    <button id="bomBtn" aria-pressed="false">BOM</button>
    <button id="moreBtn" aria-label="More actions" aria-pressed="false">⋯</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <nav id="rail" class="float" aria-label="Tools">
      <button id="t-nav" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>View</button>
      <button id="t-sel" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg>Select</button>
      <button id="t-pipe" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10a4 4 0 0 1 4-4h9"/><circle cx="4" cy="19" r="1.5"/><circle cx="18" cy="6" r="1.5"/></svg>Pipe</button>
      <button id="t-parts" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/></svg>Parts</button>
      <button id="t-measure" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>Measure</button>
      <button id="t-del" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Delete</button>
    </nav>
    <div id="parts" class="sheet" hidden></div>
    <div id="ctx" class="float">
      <div data-for="pipe">
        <button id="psum" aria-label="Pipe settings">NPS 4</button>
        <button id="ang" aria-pressed="false" aria-label="Allow 45 degree turns">45° turns</button>
        <button id="finish">Finish run</button>
      </div>
      <div data-for="equip"><button id="rot">Rotate 90°</button></div>
    </div>
    <div id="pset" class="sheet" hidden>
      <h2>Pipe settings</h2>
      <div class="grid2">
        <label class="field">Size<select id="nps"><option value="2">NPS 2 · 60.3 mm</option><option value="3">NPS 3 · 88.9 mm</option><option value="4" selected>NPS 4 · 114.3 mm</option><option value="6">NPS 6 · 168.3 mm</option></select></label>
        <label class="field">Schedule<select id="sched"><option value="40" selected>SCH 40</option><option value="80">SCH 80</option></select></label>
        <label class="field">Line number<input type="text" id="ln" value="L-001" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <label class="field">Grid snap<select id="snap"><option value="0.05">50 mm</option><option value="0.1" selected>100 mm</option><option value="0.25">250 mm</option></select></label>
      </div>
    </div>
    <div id="elev" class="float"><button id="up" aria-label="Raise 0.5 m">▲</button><output id="elv">EL +0.000 m</output><button id="down" aria-label="Lower 0.5 m">▼</button></div>
    <div id="side">
      <div id="insp" class="sheet" hidden></div>
      <div id="spec" class="sheet" hidden>
        <h2>Project spec</h2>
        <div class="row"><label class="field">Elbow radius<select id="sp-el"><option value="LR">Long radius 1.5D</option><option value="SR">Short radius 1.0D</option><option value="3D">3D bend</option></select></label></div>
        <div class="row"><label class="field">Reducer<select id="sp-red"><option value="conc">Concentric</option><option value="ecc">Eccentric, flat on bottom</option></select></label></div>
        <div class="row"><label class="field">Small branch<select id="sp-br"><option value="auto">Olet when half size or less</option><option value="tee">Always a tee</option></select></label></div>
        <div class="row"><label class="field">Olet type<select id="sp-olet"><option value="weldolet">Weldolet BW</option><option value="sockolet">Sockolet SW</option><option value="threadolet">Threadolet THD</option><option value="sweepolet">Sweepolet BW</option></select></label></div>
        <p class="empty" style="margin:0;font-size:12px">Applies to every joint. Select a fitting to change just that one.</p>
      </div>
      <aside id="bom" class="sheet" aria-label="Bill of materials" hidden></aside>
    </div>
    <div id="more" class="sheet" hidden>
      <button id="isoBtn">Isometric sheet</button>
      <button id="legendBtn">Piping symbols</button>
      <button id="specBtn" aria-pressed="false">Project spec</button>
      <button id="ortho" aria-pressed="false">Orthographic view</button>
      <button id="dims" aria-pressed="false">Show pipe lengths</button>
      <hr>
      <button id="f-save">Save project (.json)</button>
      <button id="f-open">Open project</button>
      <button id="f-csv">Export BOM (.csv)</button>
      <button id="f-dxf">Export centrelines (.dxf)</button>
      <button id="f-png">Save image (.png)</button>
      <hr>
      <button id="f-clear">Clear everything</button>
    </div>
    <input type="file" id="openf" accept=".json,application/json" hidden>
    <section id="iso" class="sheet" hidden aria-label="Isometric sheet">
      <header><h2 id="isoTitle">Isometric sheet</h2><button id="iso-save">Save .svg</button><button id="iso-close">Close</button></header>
      <div id="isoSheet"></div>
    </section>
    <div id="toast" role="status"></div>
  </main>
  <footer id="status" class="bar"><span id="hint"></span><span id="pos"></span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = THREE;

  // ---------- catalogue data ----------
  // Dimensions are public ASME values written from memory (B36.10 pipe, B16.9 butt-weld fittings,
  // B16.5 class 150 flanges, B16.10 valves). Treat them as unverified until checked against the standard.
  var SIZES = {
    2: { od: 60.3, wt: { 40: 3.91, 80: 5.54 } },
    3: { od: 88.9, wt: { 40: 5.49, 80: 7.62 } },
    4: { od: 114.3, wt: { 40: 6.02, 80: 8.56 } },
    6: { od: 168.3, wt: { 40: 7.11, 80: 10.97 } }
  };
  var OD = {}; Object.keys(SIZES).forEach(function (n) { OD[n] = SIZES[n].od; });
  var COL = { 2: 0x6aa7c8, 3: 0x8bc7a0, 4: 0xe0b45a, 6: 0xd98b7a };
  var TEE_C = { 2: 0.064, 3: 0.086, 4: 0.105, 6: 0.143 };           // tee centre to end, m
  var CAP_E = { 2: 0.038, 3: 0.051, 4: 0.064, 6: 0.089 };           // cap length, m
  var FL = { 2: [0.1524, 0.0191], 3: [0.1905, 0.0239], 4: [0.2286, 0.0239], 6: [0.2794, 0.0254] };   // flange OD, thickness, m
  var BOLTS = { 2: '4× 5/8"', 3: '4× 5/8"', 4: '8× 5/8"', 6: '8× 3/4"' };
  var VALVE_FF = {                                                  // face to face, m
    gate: { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.267 },
    globe: { 2: 0.203, 3: 0.241, 4: 0.292, 6: 0.406 },
    check: { 2: 0.203, 3: 0.241, 4: 0.292, 6: 0.356 },
    ball: { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.394 },
    butterfly: { 2: 0.043, 3: 0.046, 4: 0.052, 6: 0.056 },
    plug: { 2: 0.178, 3: 0.203, 4: 0.229, 6: 0.267 },
    control: { 2: 0.203, 3: 0.241, 4: 0.292, 6: 0.394 }
  };
  var VALVE_NAME = { gate: 'Gate valve', globe: 'Globe valve', check: 'Check valve', ball: 'Ball valve', butterfly: 'Butterfly valve', plug: 'Plug valve', control: 'Control valve' };
  var VALVE_END = { butterfly: 'wafer 150#', plug: 'flanged 150#', control: 'flanged 150#' };
  // Inline items. Lengths are rough, vendor dependent figures, not taken from a standard.
  var ITEM_L = {
    coupling: { 2: 0.07, 3: 0.09, 4: 0.1, 6: 0.13 }, union: { 2: 0.09, 3: 0.11, 4: 0.13, 6: 0.17 },
    strainer: { 2: 0.23, 3: 0.28, 4: 0.33, 6: 0.42 }, expansion: { 2: 0.3, 3: 0.3, 4: 0.3, 6: 0.3 },
    spectacle: { 2: 0.03, 3: 0.03, 4: 0.03, 6: 0.04 }, orifice: { 2: 0.05, 3: 0.05, 4: 0.05, 6: 0.06 }
  };
  var ITEM_NAME = { coupling: 'Coupling, full, SW 3000#', union: 'Union, SW 3000#', strainer: 'Y-strainer, flanged 150#', expansion: 'Expansion joint, bellows, flanged 150#', spectacle: 'Spectacle blind 150#', orifice: 'Orifice plate assembly 150#' };
  var ELBOW_F = { LR: 1.5, SR: 1.0, '3D': 3.0 };                    // centreline radius in pipe diameters
  var OLET_NAME = { weldolet: 'Weldolet BW', sockolet: 'Sockolet SW', threadolet: 'Threadolet THD', sweepolet: 'Sweepolet BW' };
  var RED_L = 0.12, STOCK = 6, STEEL = 7850, STEP = 0.5;
  var STORE = 'pipedraft.model.v1';

  var EQUIP = {
    pump: {
      name: 'Centrifugal pump', short: 'Pump',
      noz: [{ p: [-0.35, 0.4, 0], d: [-1, 0, 0], n: 4 }, { p: [-0.15, 0.7, 0], d: [0, 1, 0], n: 3 }],
      build: function (g, m) {
        var base = new T.Mesh(new T.BoxGeometry(1.5, 0.08, 0.55), m); base.position.set(0.2, 0.04, 0); g.add(base);
        var cas = new T.Mesh(new T.CylinderGeometry(0.3, 0.3, 0.4, 28), m); cas.rotation.z = Math.PI / 2; cas.position.set(-0.15, 0.4, 0); g.add(cas);
        var mot = new T.Mesh(new T.CylinderGeometry(0.22, 0.22, 0.8, 28), mat(0x3d5361, 0.6)); mot.rotation.z = Math.PI / 2; mot.position.set(0.45, 0.4, 0); g.add(mot);
      }
    },
    vessel: {
      name: 'Vertical vessel', short: 'Vessel',
      noz: [{ p: [0, 2.55, 0], d: [0, 1, 0], n: 4 }, { p: [0.6, 1.8, 0], d: [1, 0, 0], n: 4 }, { p: [0, 0.4, 0.6], d: [0, 0, 1], n: 4 }],
      build: function (g, m) {
        var body = new T.Mesh(new T.CylinderGeometry(0.6, 0.6, 2.4, 32), m); body.position.y = 1.2; g.add(body);
        var dome = new T.Mesh(new T.SphereGeometry(0.6, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), m); dome.scale.y = 0.25; dome.position.y = 2.4; g.add(dome);
      }
    }
  };

  // ---------- state ----------
  var model = blank(), hist = [];
  var tool = 'pipe', curN = 4, curS = 40, curL = 'L-001', snap = 0.1, ang45 = false, vk = 'gate', eqk = 'pump', curRot = 0, ik = 'coupling', fk = 'wn', ck = 'cap';
  var cursor = null, elev = 0, sample = true, sel = null, mA = null, showDims = false, orthoOn = false;

  function blank() { return { pipes: [], valves: [], flanges: [], caps: [], equip: [], items: [], fit: {}, spec: { elbow: 'LR', reducer: 'conc', olet: 'weldolet', branch: 'auto' } }; }
  function normalize(m) {
    var o = blank();
    if (!m || !Array.isArray(m.pipes)) return o;
    o.pipes = m.pipes.map(function (p) { p.s = p.s || 40; p.ln = p.ln || 'L-001'; return p; });
    o.valves = (m.valves || []).map(function (v) { v.s = v.s || 40; v.k = v.k || 'gate'; return v; });
    o.flanges = (m.flanges || []).map(function (f) { f.s = f.s || 40; f.t = f.t || 'wn'; return f; });
    o.caps = m.caps || []; o.equip = m.equip || [];
    o.items = (m.items || []).map(function (it) { it.s = it.s || 40; return it; });
    o.fit = m.fit || {};
    o.spec = Object.assign(o.spec, m.spec || {});
    return o;
  }

  // ---------- storage ----------
  function save() { try { localStorage.setItem(STORE, JSON.stringify(model)); } catch (e) {} }
  function load() {
    try { var s = localStorage.getItem(STORE); if (s) { var m = JSON.parse(s); if (m && m.pipes) { model = normalize(m); sample = false; return true; } } } catch (e) {}
    return false;
  }
  function exampleLayout() {
    return normalize({
      pipes: [
        { a: [0, 0, 0], b: [0, 1.5, 0], n: 4 },
        { a: [0, 1.5, 0], b: [0, 1.5, 3], n: 4 },
        { a: [0, 1.5, 3], b: [2.5, 1.5, 3], n: 4 },
        { a: [2.5, 1.5, 3], b: [2.5, 0.8, 3], n: 4 },
        { a: [2.5, 0.8, 3], b: [2.5, 0, 3], n: 3 },
        { a: [0, 1.5, 3], b: [-2, 1.5, 3], n: 4 }
      ],
      valves: [
        { p: [0, 0.8, 0], d: [0, 1, 0], n: 4 },
        { p: [-1.2, 1.5, 3], d: [-1, 0, 0], n: 4 }
      ]
    });
  }

  // ---------- scene ----------
  var cv = $('cv');
  var renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new T.Scene();
  scene.background = new T.Color(0x0d1418);
  var camP = new T.PerspectiveCamera(45, 1, 0.05, 300);

    s += '<text x="32" y="74" font-size="11" fill="' + INK + '">As drawn on the isometric sheet. The tag prefix numbers each item on the sheet, for example GV-1.</text>';
    SYM_ORDER.forEach(function (k, i) {
      var col = i % 2, row = Math.floor(i / 2), x = 40 + col * 480, y = 120 + row * 44;
      s += sym(k, x + 24, y, 0) + '<text x="' + (x + 64) + '" y="' + (y + 4) + '" font-size="13" fill="' + INK + '">' + esc(SYM[k].name) + '</text>';
      s += '<text x="' + (x + 400) + '" y="' + (y + 4) + '" font-size="12" text-anchor="end" fill="' + INK + '">' + SYM[k].tag + '</text>';
    });
    return s + '</svg>';
  }
  // ---------- input ----------
  var ptrs = {}, nPtr = 0, down = null, multi = false, pinch = null, lastPen = -1e9;
  function penNow() { return performance.now() - lastPen < 350; }
  function pinchState() {
    var k = Object.keys(ptrs), a = ptrs[k[0]], b = ptrs[k[1]];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  function pan(dx, dy) {
    var h = cv.clientHeight, s = 2 * dist * Math.tan(camP.fov * Math.PI / 360) / h;
    var right = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    var up = new T.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
  }
  cv.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'pen') lastPen = performance.now();
    else if (e.pointerType === 'touch' && penNow()) return;        // palm resting while the Pencil is in use
    $('pset').hidden = true; $('more').hidden = true;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; nPtr++;
    if (e.pointerType === 'pen' && tool !== 'nav') ghost(e);
    if (nPtr === 1) { down = { x: e.clientX, y: e.clientY, moved: false }; multi = false; }
    else { multi = true; if (nPtr === 2) pinch = pinchState(); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'pen') lastPen = performance.now();
    var p = ptrs[e.pointerId];
    if (!p) { if (e.pointerType !== 'touch') queueGhost(e); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (nPtr === 1 && e.pointerType === 'pen' && tool !== 'nav') { queueGhost(e); return; }   // Pencil aims, lifting places
    if (nPtr === 1) {
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
      if (down.moved) { theta -= dx * 0.007; phi = Math.min(1.5, Math.max(0.1, phi - dy * 0.007)); }
    } else if (nPtr === 2) {
      var s = pinchState();
      dist = Math.min(60, Math.max(0.8, dist * pinch.d / Math.max(s.d, 1)));
      pan(s.x - pinch.x, s.y - pinch.y);
      pinch = s;
    }
  });
  function end(e) {
    if (!ptrs[e.pointerId]) return;
    if (e.pointerType === 'pen') lastPen = performance.now();
    var pen = e.pointerType === 'pen' && tool !== 'nav';
    var tap = nPtr === 1 && !multi && down && (pen || !down.moved) && e.type === 'pointerup';
    delete ptrs[e.pointerId]; nPtr--;
    if (nPtr === 2) pinch = pinchState();
    if (tap) onTap(e);
  }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', function (e) { e.preventDefault(); dist = Math.min(60, Math.max(0.8, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

  // ---------- UI ----------
  var RAIL = ['nav', 'sel', 'pipe', 'measure', 'del'];
  var PARTS = {
    valve: { label: 'Valves', items: [['gate', 'Gate'], ['globe', 'Globe'], ['check', 'Check'], ['ball', 'Ball'], ['butterfly', 'Butterfly'], ['plug', 'Plug'], ['control', 'Control']] },
    flange: { label: 'Flanges', items: [['wn', 'Weld-neck pair'], ['so', 'Slip-on pair'], ['lj', 'Lap-joint pair'], ['bl', 'Blind, pipe end']] },
    item: { label: 'Inline', items: [['coupling', 'Coupling'], ['union', 'Union'], ['strainer', 'Y-strainer'], ['expansion', 'Expansion joint'], ['spectacle', 'Spectacle blind'], ['orifice', 'Orifice plate']] },
    cap: { label: 'Ends', items: [['cap', 'Cap BW'], ['plug', 'Plug THD']] },
    equip: { label: 'Equipment', items: [['pump', 'Centrifugal pump'], ['vessel', 'Vertical vessel']] }
  };
  var PART_KEYS = Object.keys(PARTS), lastPart = 'valve';
  function partVal(c) { return { valve: vk, flange: fk, item: ik, cap: ck, equip: eqk }[c]; }
  function setPart(c, v) {
    if (c === 'valve') vk = v; else if (c === 'flange') fk = v; else if (c === 'item') ik = v; else if (c === 'cap') ck = v; else eqk = v;
    updateUi();
  }
  function renderParts() {
    var tabs = PART_KEYS.map(function (c) { return '<button data-tab="' + c + '" aria-pressed="' + (tool === c) + '">' + PARTS[c].label + '</button>'; }).join('');
    var chips = PARTS[tool].items.map(function (it) { return '<button data-chip="' + it[0] + '" aria-pressed="' + (partVal(tool) === it[0]) + '">' + it[1] + '</button>'; }).join('');
    $('parts').innerHTML = '<div class="tabs">' + tabs + '</div><div class="chips">' + chips + '</div>';
  }
  $('parts').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    if (b.dataset.tab) setTool(b.dataset.tab); else if (b.dataset.chip) setPart(tool, b.dataset.chip);
  });
  function setTool(t) {
    tool = t; mA = null; measLine.visible = false; ghostLine.visible = marker.visible = false;
    if (PARTS[t]) lastPart = t;
    $('pset').hidden = true; $('more').hidden = true;
    if (t !== 'sel') sel = null;
    rebuild(); updateUi();
  }
  function updateUi() {
    RAIL.forEach(function (t) { $('t-' + t).setAttribute('aria-pressed', String(tool === t)); });
    $('t-parts').setAttribute('aria-pressed', String(!!PARTS[tool]));
    $('parts').hidden = !PARTS[tool]; if (PARTS[tool]) renderParts();
    $('psum').textContent = 'NPS ' + curN + ' · SCH ' + curS + ' · ' + curL;
    document.querySelectorAll('[data-for]').forEach(function (g) { g.hidden = g.getAttribute('data-for').split(' ').indexOf(tool) < 0; });
    $('finish').disabled = !cursor;
    $('elv').textContent = 'EL ' + (elev >= 0 ? '+' : '') + elev.toFixed(3) + ' m';
    $('undo').disabled = !hist.length;
    $('ang').setAttribute('aria-pressed', String(ang45));
    $('ortho').setAttribute('aria-pressed', String(orthoOn));
    $('dims').setAttribute('aria-pressed', String(showDims));
    $('specBtn').setAttribute('aria-pressed', String(!$('spec').hidden));
    $('moreBtn').setAttribute('aria-pressed', String(!$('more').hidden));
    $('sp-el').value = model.spec.elbow; $('sp-red').value = model.spec.reducer; $('sp-br').value = model.spec.branch; $('sp-olet').value = model.spec.olet;
    curMark.visible = !!cursor && tool === 'pipe';
    if (cursor) curMark.position.set(cursor[0], cursor[1], cursor[2]);
    var hints = {
      nav: 'Drag to orbit. Two fingers to pan and zoom.',
      sel: 'Tap a pipe, valve, flange or equipment to edit it.',
      pipe: cursor ? 'Tap to extend the run. ' + (ang45 ? 'Snaps to 45° steps. ' : 'Snaps to X or Z. ') + '▲ ▼ add a vertical pipe.' : 'Tap to start: grid, a pipe end, a nozzle, or anywhere on a pipe to branch.',
      valve: 'Tap a pipe to place a ' + VALVE_NAME[vk].toLowerCase() + '.',
      flange: fk === 'bl' ? 'Tap an open pipe end to fit a blind flange.' : 'Tap a pipe to place a flange pair with gasket and bolts.',
      item: 'Tap a pipe to place the fitting inline.',
      cap: 'Tap an open pipe end to close it.',
      equip: 'Tap the grid to place the ' + EQUIP[eqk].name.toLowerCase() + '. Its nozzles are start points for pipes.',
      measure: 'Tap two points to measure. Pipe ends and nozzles snap.',
      del: 'Tap a pipe, valve, flange or equipment to remove it.'
    };
    $('hint').textContent = hints[tool];
    if (tool !== 'pipe' && tool !== 'equip' && tool !== 'measure') { ghostLine.visible = marker.visible = false; }
  }
  RAIL.forEach(function (t) { $('t-' + t).onclick = function () { setTool(t); }; });
  $('t-parts').onclick = function () { setTool(PARTS[tool] ? 'nav' : lastPart); };
  $('psum').onclick = function () { $('pset').hidden = !$('pset').hidden; $('more').hidden = true; };
  $('more').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (b && b.id !== 'ortho' && b.id !== 'dims') $('more').hidden = true;
  });
  $('nps').onchange = function () { curN = +$('nps').value; updateUi(); };
  $('sched').onchange = function () { curS = +$('sched').value; updateUi(); };
  $('ln').onchange = function () { curL = $('ln').value.trim() || 'L-001'; $('ln').value = curL; updateUi(); };
  $('snap').onchange = function () { snap = +$('snap').value; };
  $('ang').onclick = function () { ang45 = !ang45; updateUi(); };
  function setSpec(k, v) { pushHist(); model.spec[k] = v; changed(); }
  $('sp-el').onchange = function () { setSpec('elbow', this.value); };
  $('sp-red').onchange = function () { setSpec('reducer', this.value); };
  $('sp-br').onchange = function () { setSpec('branch', this.value); };
  $('sp-olet').onchange = function () { setSpec('olet', this.value); };
  $('specBtn').onclick = function () { $('spec').hidden = !$('spec').hidden; updateUi(); };
  $('rot').onclick = function () { curRot = (curRot + 1) % 4; toast('Rotation ' + curRot * 90 + '°'); };
  $('finish').onclick = function () { cursor = null; updateUi(); };
  $('undo').onclick = function () {
    if (!hist.length) return;
    model = normalize(JSON.parse(hist.pop())); cursor = null; sel = null; save(); rebuild(); updateUi();
  };
  $('bomBtn').onclick = function () { var b = $('bom'); b.hidden = !b.hidden; $('bomBtn').setAttribute('aria-pressed', String(!b.hidden)); $('more').hidden = true; };
  $('moreBtn').onclick = function () { $('more').hidden = !$('more').hidden; $('pset').hidden = true; $('moreBtn').setAttribute('aria-pressed', String(!$('more').hidden)); };
  function vertical(sign) {
    if (cursor) {
      var y = Math.round((cursor[1] + sign * STEP) * 1000) / 1000;
      if (y < 0) return;
      pushHist();
      var q = [cursor[0], y, cursor[2]];
      addPipe(cursor, q, curN, curS, curL); cursor = q; elev = y; changed();
    } else {
      elev = Math.max(0, Math.round((elev + sign * STEP) * 1000) / 1000); updateUi();
    }
  }
  $('up').onclick = function () { vertical(1); };
  $('down').onclick = function () { vertical(-1); };
  ['iso', 'top', 'front', 'right'].forEach(function (v) { $('v-' + v).onclick = function () { setView(v); }; });
  $('v-fit').onclick = fit;
  $('ortho').onclick = function () { orthoOn = !orthoOn; updateUi(); };
  $('dims').onclick = function () { showDims = !showDims; rebuild(); updateUi(); };
  var isoCur = null, isoName = 'pipedraft-iso.svg';
  function showSheet(title, svg, file) {
    isoCur = svg; isoName = file; $('isoTitle').textContent = title;
    $('isoSheet').innerHTML = svg || '<p style="padding:24px;color:#14191c">Draw some pipe first.</p>';
    $('iso').hidden = false;
  }
  $('isoBtn').onclick = function () { showSheet('Isometric sheet', isoSvg(), 'pipedraft-iso.svg'); };
  $('legendBtn').onclick = function () { showSheet('Piping symbols', legendSvg(), 'pipedraft-symbols.svg'); };
  $('iso-close').onclick = function () { $('iso').hidden = true; };
  $('iso-save').onclick = function () { if (isoCur) saveBlob(isoName, new Blob([isoCur], { type: 'image/svg+xml' })); else toast('Nothing to save'); };
  $('f-save').onclick = function () { saveBlob('pipedraft.json', new Blob([JSON.stringify({ app: 'pipedraft', version: 2, model: model }, null, 1)], { type: 'application/json' })); };
  $('f-open').onclick = function () { $('openf').click(); };
  $('openf').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result), m = d && d.model ? d.model : d;
        if (!m || !Array.isArray(m.pipes)) throw new Error('bad');
        pushHist(); model = normalize(m); cursor = null; sel = null; changed(); fit(); toast('Project opened');
      } catch (x) { toast('That file is not a PipeDraft project'); }
    };
    rd.readAsText(f); this.value = '';
  };
  $('f-csv').onclick = function () { saveBlob('pipedraft-bom.csv', new Blob([csv()], { type: 'text/csv' })); };
  $('f-dxf').onclick = function () { saveBlob('pipedraft.dxf', new Blob([dxf()], { type: 'application/dxf' })); };
  $('f-png').onclick = function () { renderer.render(scene, camera); cv.toBlob(function (b) { if (b) saveBlob('pipedraft.png', b); }); };
  $('f-clear').onclick = function () {
    var b = $('f-clear');
    if (b.dataset.arm !== '1') {
      b.dataset.arm = '1'; b.textContent = 'Tap again to clear';
      setTimeout(function () { b.dataset.arm = ''; b.textContent = 'Clear everything'; }, 2500);
      return;
    }
    b.dataset.arm = ''; b.textContent = 'Clear everything';
    pushHist(); model = blank(); cursor = null; sel = null; changed();
  };

  // ---------- iPad niceties ----------
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {                 // Magic Keyboard / Smart Keyboard
    var tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
    var k = e.key.toLowerCase();
    if (e.metaKey || e.ctrlKey) { if (k === 'z') { e.preventDefault(); $('undo').click(); } return; }
    var map = { n: 'nav', s: 'sel', p: 'pipe', v: 'valve', f: 'flange', i: 'item', c: 'cap', e: 'equip', m: 'measure', d: 'del', delete: 'del', backspace: 'del' };
    if (k === 'escape' || k === 'enter') { cursor = null; sel = null; mA = null; rebuild(); updateUi(); }
    else if (map[k]) setTool(map[k]);
    else if (k === 'arrowup') vertical(1);
    else if (k === 'arrowdown') vertical(-1);
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) {}

  // Hook for the headless tests in test/.
  window.PipeDraft = {
    load: function (m) { model = normalize(m); sel = null; rebuild(); },
    get model() { return model; },
    addPipe: addPipe, rebuild: rebuild, rows: bomRows, warns: function () { return warns; },
    nozzles: function () { return nozList; }, iso: isoSvg, legend: legendSvg, dxf: dxf, csv: csv,
    startAtNozzle: startAtNozzle, routeTo: routeTo, cursor: function () { return cursor; },
    project: function (p) { var r = cv.getBoundingClientRect(), v = V(p).project(camera); return { x: (v.x + 1) / 2 * r.width + r.left, y: (1 - v.y) / 2 * r.height + r.top }; }
  };

  // ---------- boot ----------
  if (!load()) model = exampleLayout();
  $('mode').textContent = sample ? 'Example layout' : 'My layout';
  rebuild(); updateUi(); resize();
  (function loop() { placeCamera(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
